spring.application.name=read-model-service
server.port=8086

# PostgreSQL (ConfiguraÃ§Ã£o via VariÃ¡veis de Ambiente / .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Pool (limite de 2 conexÃµes)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis â€” URL Ãºnica suporta local (redis://) e Upstash/produÃ§Ã£o (rediss:// com TLS)
# Em desenvolvimento: nÃ£o definir SPRING_REDIS_URL â†’ usa localhost automaticamente
# Em produÃ§Ã£o: definir SPRING_REDIS_URL=rediss://default:SENHA@willing-amoeba-77167.upstash.io:6379
spring.data.redis.url=${SPRING_REDIS_URL:redis://localhost:6379}
spring.cache.redis.time-to-live=30000
spring.data.redis.repositories.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo
# -- Otimizações para Azure Container Apps (Fase 1) ------------------
# Boot mais rápido: beans criados sob demanda (escala zero sobe em ~5s)
spring.main.lazy-initialization=true
# Virtual Threads (Java 21): menos memória, mais throughput — transparente para o código
spring.threads.virtual.enabled=true
