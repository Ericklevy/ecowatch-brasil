name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [data-ingestion-service, alert-service, analytics-service, notification-service, read-model-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes do ${{ matrix.servico }}
        working-directory: ${{ matrix.servico }}
        run: mvn -B -ntp test
