spring.application.name=notification-service
server.port=8084

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
notification.email.default.to=${NOTIFICATION_EMAIL_DEFAULT_TO:7x8fw.test@inbox.testmail.app}

# Firebase Push Notifications (opcional — desativado por padrão)
# Para ativar: firebase.enabled=true + arquivo firebase-service-account.json no classpath
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account=firebase-service-account.json

# PostgreSQL (ConfiguraÃ§Ã£o via VariÃ¡veis de Ambiente / .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Pool (limite de 2 conexÃµes)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# -- Otimizações para Azure Container Apps (Fase 1) ------------------
# Boot mais rápido: beans criados sob demanda (escala zero sobe em ~5s)
spring.main.lazy-initialization=true
# Virtual Threads (Java 21): menos memória, mais throughput — transparente para o código
spring.threads.virtual.enabled=true
