spring.application.name=alert-service
server.port=8081

# PostgreSQL (ConfiguraÃ§Ã£o via VariÃ¡veis de Ambiente / .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Pool (limite de 2 conexÃµes)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${SPRING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${SPRING_KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:$Default}
spring.kafka.consumer.auto-offset-reset=earliest
eventhubs.connection-string=${EVENT_HUBS_CONNECTION_STRING:}

# Redis â€” URL Ãºnica suporta local (redis://) e Upstash/produÃ§Ã£o (rediss:// com TLS)
# Em desenvolvimento: nÃ£o definir SPRING_REDIS_URL â†’ usa localhost automaticamente
# Em produÃ§Ã£o: definir SPRING_REDIS_URL=rediss://default:SENHA@willing-amoeba-77167.upstash.io:6379
spring.data.redis.url=${SPRING_REDIS_URL:redis://localhost:6379}
spring.cache.redis.time-to-live=300000
spring.data.redis.repositories.enabled=false

spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# -- Otimizações para Azure Container Apps (Fase 1) ------------------
# Boot mais rápido: beans criados sob demanda (escala zero sobe em ~5s)
spring.main.lazy-initialization=true
# Virtual Threads (Java 21): menos memória, mais throughput — transparente para o código
spring.threads.virtual.enabled=true
