# ===============================
# Configurações do Servidor
# ===============================
spring.application.name=alert-service
# Cada serviço rodará em uma porta diferente para não dar conflito na sua máquina
server.port=8081

# ===============================
# Configurações do PostgreSQL
# ===============================
# Aponta para o banco que subimos no Docker (suporta variáveis de ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ecowatch}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecowatch}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecowatch123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate (Cria e atualiza as tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Configurações do Apache Kafka
# ===============================
# Aponta para o broker do Kafka no Docker
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=alert-group
spring.kafka.consumer.auto-offset-reset=earliest


# Redis (já está rodando no Docker)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
# TTL padrão para cache (5 minutos)
spring.cache.redis.time-to-live=300000
# Evita que o Spring Data Redis tente criar repositórios automaticamente
spring.data.redis.repositories.enabled=false


# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}