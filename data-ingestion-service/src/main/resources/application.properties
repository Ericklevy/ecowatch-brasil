# Nome da aplicação
spring.application.name=data-ingestion-service

# Servidor
server.port=8083

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# NASA POWER
api.nasa.url=https://power.larc.nasa.gov

# Open-Meteo (fallback)
api.open-meteo.url=https://api.open-meteo.com/v1

# Cidades (OBRIGATÓRIO)
monitor.cities=Brasilia,Rio de Janeiro,Sao Paulo,Salvador,Recife,Porto Alegre,Curitiba,Belo Horizonte,Fortaleza,Manaus

# Encoding
spring.properties.encoding=UTF-8

# ===============================
# Métricas (Micrometer + Prometheus)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# IBGE (opcional – para validação futura)
api.ibge.url=https://servicodados.ibge.gov.br/api/v1