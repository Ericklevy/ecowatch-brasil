# Nome da aplicaÃ§Ã£o
spring.application.name=data-ingestion-service

# Servidor
server.port=8083

# Kafka / Azure Event Hubs
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${SPRING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${SPRING_KAFKA_SASL_JAAS_CONFIG:}

# NASA POWER
api.nasa.url=https://power.larc.nasa.gov

# Open-Meteo (clima base â€” fallback)
api.open-meteo.url=https://api.open-meteo.com/v1

# Open-Meteo Air Quality (qualidade do ar â€” gratuito, sem chave)
api.open-meteo.air-quality-url=https://air-quality-api.open-meteo.com/v1

# INPE BDQueimadas (focos de incÃªndio)
# Defina INPE_URL no .env com a URL real para usar dados reais
api.inpe.url=${INPE_URL:SIMULADO}

# CEMADEN (alertas de enxurrada e deslizamentos)
# Defina CEMADEN_URL no .env com a URL real para usar dados reais
api.cemaden.url=${CEMADEN_URL:SIMULADO}

# ANA HidroWeb (nÃ­vel dos rios)
# Defina ANA_URL no .env com o endpoint HidroWeb para dados reais
api.ana.url=${ANA_URL:SIMULADO}


# Cidades monitoradas (OBRIGATÃ“RIO)
monitor.cities=Brasilia,Rio de Janeiro,Sao Paulo,Salvador,Recife,Porto Alegre,Curitiba,Belo Horizonte,Fortaleza,Manaus

# ===============================
# Agendamento AutomÃ¡tico (Cron Job)
# ===============================
# ExpressÃ£o cron (6 campos Spring): segundo minuto hora dia mÃªs dia-da-semana
# PadrÃ£o: a cada hora cheia (minuto 0, segundo 0)
# Para testes, use: 0 */5 * * * * (a cada 5 minutos)
scheduler.cron=${SCHEDULER_CRON:0 0 * * * *}

# Encoding
spring.properties.encoding=UTF-8

# ===============================
# MÃ©tricas (Micrometer + Prometheus)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# IBGE (opcional â€“ para validaÃ§Ã£o futura)
api.ibge.url=https://servicodados.ibge.gov.br/api/v1
# -- Otimizações para Azure Container Apps (Fase 1) ------------------
# Boot mais rápido: beans criados sob demanda (escala zero sobe em ~5s)
spring.main.lazy-initialization=true
# Virtual Threads (Java 21): menos memória, mais throughput — transparente para o código
spring.threads.virtual.enabled=true
